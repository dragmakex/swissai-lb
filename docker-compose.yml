# SINGLE-REPLICA topology for laptop/VPS: one app, built dashboard and persistent SQLite.
# Use a TLS reverse proxy or SSH tunnel for remote access. Do not scale the SQLite service.
# Vite and PostgreSQL are opt-in profiles, not part of normal startup.
services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env.local
        required: false
    ports:
      - "127.0.0.1:2455:2455"
    volumes:
      - swissai-lb-data:/var/lib/swissai-lb
    develop:
      watch:
        - action: sync+restart
          path: ./app
          target: /app/app
        - action: rebuild
          path: ./pyproject.toml
        - action: rebuild
          path: ./uv.lock
        - action: rebuild
          path: ./Dockerfile
    restart: unless-stopped

  frontend:
    profiles: ["dev"]
    build:
      context: ./frontend
      dockerfile_inline: |
        FROM oven/bun:1.4.3-alpine
        WORKDIR /app
        COPY package.json bun.lock ./
        RUN bun install --frozen-lockfile
        COPY . .
        CMD ["bun", "run", "dev", "--host", "0.0.0.0"]
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      API_PROXY_TARGET: http://server:2455
    develop:
      watch:
        - action: sync
          path: ./frontend
          target: /app
          ignore:
            - node_modules/
        - action: rebuild
          path: ./frontend/package.json
        - action: rebuild
          path: ./frontend/bun.lock

  postgres:
    image: postgres:18-alpine
    profiles: ["postgres"]
    entrypoint:
      - sh
      - -ceu
      - |
        if [ -f /var/lib/postgresql/PG_VERSION ]; then
          echo >&2 "Detected a pre-Postgres-18 data directory at /var/lib/postgresql."
          echo >&2 "Run: docker compose --profile postgres-upgrade run --rm postgres-upgrade"
          echo >&2 "Refusing to start postgres:18-alpine before the named volume is upgraded."
          exit 1
        fi
        if [ -f /var/lib/postgresql/data/PG_VERSION ]; then
          pg_major="$$(cat /var/lib/postgresql/data/PG_VERSION)"
          if [ "$$pg_major" != "18" ]; then
            echo >&2 "Detected a nested Postgres $$pg_major data directory at /var/lib/postgresql/data."
            echo >&2 "Run pg_upgrade against that data directory before starting postgres:18-alpine."
            echo >&2 "For the default Compose volume layout, run: docker compose --profile postgres-upgrade run --rm postgres-upgrade"
            exit 1
          fi
        fi
        if [ "$#" -eq 0 ]; then
          set -- postgres
        fi
        exec docker-entrypoint.sh "$@"
      - swissai-lb-postgres-entrypoint-guard
    # Docker's default /dev/shm is 64MB. PostgreSQL parallel workers exchange
    # tuples through dynamic shared memory under /dev/shm, so hash joins that
    # spill past 64MB abort with "could not resize shared memory segment ...
    # No space left on device". 1GB gives parallel query realistic headroom.
    shm_size: 1gb
    environment:
      POSTGRES_USER: swissai_lb
      POSTGRES_PASSWORD: swissai_lb
      POSTGRES_DB: swissai_lb
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swissai_lb -d swissai_lb"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - swissai-lb-postgres-data:/var/lib/postgresql
    restart: unless-stopped

  postgres-upgrade:
    image: pgautoupgrade/pgautoupgrade:18-alpine@sha256:48b44882565694a297c62b07e8384b89c0e4264b169b67a655569974752327d0
    profiles: ["postgres-upgrade"]
    environment:
      POSTGRES_USER: swissai_lb
      POSTGRES_PASSWORD: swissai_lb
      POSTGRES_DB: swissai_lb
      PGAUTO_ONESHOT: "yes"
    volumes:
      - swissai-lb-postgres-data:/var/lib/postgresql
    restart: "no"

networks:
  default:
    driver: bridge

volumes:
  swissai-lb-data:
    name: swissai-lb-data
  swissai-lb-postgres-data:
    name: swissai-lb-postgres-data
