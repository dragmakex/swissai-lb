schema: spec-driven

context: |
  Process: This repo uses the OpenSpec workflow. Always read AGENTS.md.
  OpenSpec is the source of truth. Keep spec.md requirements-only.
  Narrative operations, recovery and generated reference material live beside the owning capability in context.md, ops.md or reference.md.
  The README is a short SwissAI quickstart. There is no maintained MkDocs site, Helm chart, Nix package or distroless image.
  Preserve upstream attribution, migration history, security boundaries and operator data. Do not publish or change running services without authorization.

rules:
  proposal:
    - Keep the scope focused and name removed compatibility/deployment contracts.
  design:
    - Put rationale, constraints, failure modes and concrete examples here rather than in normative requirements.
  specs:
    - Use testable SHALL/MUST requirements and scenarios; narrative context belongs alongside the owning capability.
  tasks:
    - Include caller/test/config cleanup and concrete verification for removed surfaces.
