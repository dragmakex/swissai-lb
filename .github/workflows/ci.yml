name: CI

on:
  push:
    branches: ["main"]
  # Metadata-only edits must not cancel or mint passing checks for an unchanged head.
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # Detect changed areas so PRs can skip unrelated expensive jobs.
  # Pushes to main and merge queue events still run the full suite.
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.force.outputs.full_suite || steps.filter.outputs.frontend }}
      backend: ${{ steps.force.outputs.full_suite || steps.filter.outputs.backend }}
      docker: ${{ steps.force.outputs.full_suite || steps.filter.outputs.docker }}
      migrations: ${{ steps.force.outputs.full_suite || steps.filter.outputs.migrations }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Detect full-suite events
        id: force
        run: |
          if [[ "${{ github.event_name }}" == "push" || "${{ github.event_name }}" == "merge_group" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "full_suite=true" >> "$GITHUB_OUTPUT"
          else
            echo "full_suite=" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect file changes
        id: filter
        if: steps.force.outputs.full_suite != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/detect_changed_areas.py

  openspec:
    name: OpenSpec validation
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate canonical OpenSpec capabilities
        run: npx --yes @fission-ai/openspec@1.11.0 validate --specs

      - name: Strictly validate changed OpenSpec folders
        run: python3 .github/scripts/validate_changed_openspec.py

  frontend-lint:
    name: Frontend lint (eslint)
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.frontend == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"

      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.bun/install/cache
            frontend/node_modules
          key: bun-1.3.14-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: |
            bun-1.3.14-${{ runner.os }}-${{ runner.arch }}-

      - name: Run frontend lint
        run: make frontend-lint

  frontend-typecheck:
    name: Frontend type check (tsc)
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.frontend == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"

      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.bun/install/cache
            frontend/node_modules
          key: bun-1.3.14-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: |
            bun-1.3.14-${{ runner.os }}-${{ runner.arch }}-

      - name: Run frontend type check
        run: make frontend-typecheck

  frontend-test:
    # Keep this exact job name: the repository ruleset requires "Frontend
    # tests (vitest + coverage)" as a check context. PR runs skip the coverage
    # instrumentation below, but the check name must not change.
    name: Frontend tests (vitest + coverage)
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.frontend == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"

      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.bun/install/cache
            frontend/node_modules
          key: bun-1.3.14-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: |
            bun-1.3.14-${{ runner.os }}-${{ runner.arch }}-

      # PRs run vitest without coverage instrumentation for a faster signal;
      # main pushes and the merge queue keep the full coverage run.
      - name: Run frontend tests
        if: github.event_name == 'pull_request'
        run: make frontend-test-fast

      - name: Run frontend tests with coverage
        if: github.event_name != 'pull_request'
        run: make frontend-test

  frontend-build:
    name: Frontend build (vite)
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.frontend == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"

      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.bun/install/cache
            frontend/node_modules
          key: bun-1.3.14-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: |
            bun-1.3.14-${{ runner.os }}-${{ runner.arch }}-

      - name: Build frontend
        run: make frontend-build

  dashboard-browser-smoke:
    name: Dashboard browser smoke (Playwright)
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"

      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.bun/install/cache
            frontend/node_modules
          key: bun-1.3.14-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: |
            bun-1.3.14-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('frontend/bun.lock') }}

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          python-version: "3.13"
          enable-cache: true
          prune-cache: true

      - name: Install frontend dependencies
        run: make frontend-install

      - name: Install Playwright Chromium
        run: cd frontend && bun run playwright install --with-deps chromium

      - name: Run dashboard browser smoke test
        run: make test-dashboard-browser-smoke

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.backend == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          python-version: "3.13"
          enable-cache: true
          prune-cache: true

      - name: Ruff check
        run: make lint

  typecheck:
    name: Type check (ty)
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.backend == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          python-version: "3.13"
          enable-cache: true
          prune-cache: true

      - name: Ty check
        run: make typecheck

  test:
    name: Tests (pytest, ${{ matrix.slice.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        slice:
          - name: unit
          - name: integration-bridge
          - name: e2e
    env:
      PYTHONFAULTHANDLER: "1"

    steps:
      - name: Skip backend tests for unrelated changes
        if: needs.changes.outputs.backend != 'true'
        run: echo "Backend files unchanged; required pytest context satisfied."

      - name: Checkout repository
        if: needs.changes.outputs.backend == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Bun
        if: needs.changes.outputs.backend == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"

      - name: Cache Bun dependencies
        if: needs.changes.outputs.backend == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.bun/install/cache
            frontend/node_modules
          key: bun-1.3.14-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: |
            bun-1.3.14-${{ runner.os }}-${{ runner.arch }}-

      - name: Set up uv
        if: needs.changes.outputs.backend == 'true'
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          python-version: "3.13"
          enable-cache: true
          prune-cache: true

      - name: Run tests
        if: needs.changes.outputs.backend == 'true'
        run: make test-${{ matrix.slice.name }}

  # integration-core is split into deterministic shards to shorten the CI
  # critical path; each shard's make target verifies the shards partition the
  # full selection before running pytest (see .github/scripts/pytest_shards.py).
  test-integration-core:
    name: Tests (pytest, integration-core-${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      PYTHONFAULTHANDLER: "1"

    steps:
      - name: Skip backend tests for unrelated changes
        if: needs.changes.outputs.backend != 'true'
        run: echo "Backend files unchanged; required pytest context satisfied."

      - name: Checkout repository
        if: needs.changes.outputs.backend == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Bun
        if: needs.changes.outputs.backend == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"

      - name: Cache Bun dependencies
        if: needs.changes.outputs.backend == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.bun/install/cache
            frontend/node_modules
          key: bun-1.3.14-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: |
            bun-1.3.14-${{ runner.os }}-${{ runner.arch }}-

      - name: Set up uv
        if: needs.changes.outputs.backend == 'true'
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          python-version: "3.13"
          enable-cache: true
          prune-cache: true

      - name: Run tests
        if: needs.changes.outputs.backend == 'true'
        run: make test-integration-core-${{ matrix.shard }}

  # Aggregate for the shards above. Keep this exact job name: the repository
  # ruleset requires "Tests (pytest, integration-core)" as a check context.
  # The shard jobs never skip at job level (they use the placeholder-step
  # pattern), so anything other than an all-success matrix result must fail
  # here — skipped or cancelled shards are not laundered into a passing check.
  test-integration-core-required:
    name: Tests (pytest, integration-core)
    runs-on: ubuntu-24.04
    if: always()
    needs:
      - test-integration-core

    steps:
      - name: Require every integration-core shard to pass
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS_JSON"])
          failed = {
              name: details["result"]
              for name, details in sorted(needs.items())
              if details.get("result") != "success"
          }
          if failed:
              for name, result in failed.items():
                  print(f"{name}: {result}")
              sys.exit(1)
          print("all integration-core shards passed")
          PY

  test-postgres:
    name: Tests (pytest, PostgreSQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: changes
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: codex_lb
          POSTGRES_PASSWORD: codex_lb
          POSTGRES_DB: codex_lb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codex_lb -d codex_lb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SWISSAI_LB_TEST_DATABASE_URL: postgresql+asyncpg://codex_lb:codex_lb@127.0.0.1:5432/codex_lb
      PYTHONFAULTHANDLER: "1"

    steps:
      - name: Skip PostgreSQL tests for unrelated changes
        if: needs.changes.outputs.backend != 'true'
        run: echo "Backend files unchanged; required PostgreSQL context satisfied."

      - name: Checkout repository
        if: needs.changes.outputs.backend == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Bun
        if: needs.changes.outputs.backend == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"

      - name: Cache Bun dependencies
        if: needs.changes.outputs.backend == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.bun/install/cache
            frontend/node_modules
          key: bun-1.3.14-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: |
            bun-1.3.14-${{ runner.os }}-${{ runner.arch }}-

      - name: Set up uv
        if: needs.changes.outputs.backend == 'true'
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          python-version: "3.13"
          enable-cache: true
          prune-cache: true

      - name: Run tests
        if: needs.changes.outputs.backend == 'true'
        run: make test-postgres

  migration-check:
    name: Migration check (alembic)
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.migrations == 'true' || needs.changes.outputs.backend == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          python-version: "3.13"
          enable-cache: true
          prune-cache: true

      - name: Validate migration policy and drift
        run: make migration-check

  migration-check-postgres:
    name: Migration check (alembic, PostgreSQL)
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.migrations == 'true' || needs.changes.outputs.backend == 'true'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: codex_lb
          POSTGRES_PASSWORD: codex_lb
          POSTGRES_DB: codex_lb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codex_lb -d codex_lb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          python-version: "3.13"
          enable-cache: true
          prune-cache: true

      - name: Validate migration policy and drift on PostgreSQL
        run: make migration-check-postgres

  package:
    name: Package (build)
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"

      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.bun/install/cache
            frontend/node_modules
          key: bun-1.3.14-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: |
            bun-1.3.14-${{ runner.os }}-${{ runner.arch }}-

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          python-version: "3.13"
          enable-cache: true
          prune-cache: true

      - name: Build and verify package
        run: make package

  docker:
    name: Docker build
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    permissions:
      actions: read
      contents: read
      security-events: write
    env:
      DOCKER_CACHE_SCOPE: ${{ github.event_name == 'pull_request' && format('swissai-lb-pr-{0}', github.event.pull_request.number) || 'swissai-lb-main' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: swissai-lb:ci
          cache-from: type=gha,scope=${{ env.DOCKER_CACHE_SCOPE }}
          cache-to: type=gha,mode=max,scope=${{ env.DOCKER_CACHE_SCOPE }}

      - name: Scan Docker image with Trivy (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: swissai-lb:ci
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH,MEDIUM,LOW
          ignore-unfixed: true

      - name: Upload Trivy scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          sarif_file: trivy-results.sarif
          # Keep PR and main uploads in the same CI category so Code Scanning
          # can compare pull-request alerts against the default-branch baseline.
          category: .github/workflows/ci.yml:docker

      - name: Enforce Trivy high-severity gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: swissai-lb:ci
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  ci-required:
    name: CI Required
    runs-on: ubuntu-24.04
    if: always()
    needs:
      - changes
      - openspec
      - frontend-lint
      - frontend-typecheck
      - frontend-test
      - frontend-build
      - dashboard-browser-smoke
      - lint
      - typecheck
      - test
      - test-integration-core
      - test-integration-core-required
      - test-postgres
      - migration-check
      - migration-check-postgres
      - package
      - docker

    steps:
      - name: Require every CI job to pass
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS_JSON"])
          failed = {
              name: details["result"]
              for name, details in sorted(needs.items())
              if details.get("result") not in {"success", "skipped"}
          }
          if failed:
              for name, result in failed.items():
                  print(f"{name}: {result}")
              sys.exit(1)
          print("all required CI jobs passed")
          PY
