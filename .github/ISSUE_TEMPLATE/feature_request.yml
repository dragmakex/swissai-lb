name: Feature request
description: Suggest a focused improvement to SwissAI key rotation or its dashboard.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem needs solving?
      description: Explain the user/operator need without credentials or private request content.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Smallest useful solution
      description: Describe the desired behavior and alternatives. Significant changes use the OpenSpec workflow.
    validations:
      required: true
