name: Bug report
description: Report a reproducible SwissAI LB problem.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never post API keys, passwords, bootstrap tokens, database files or prompt/completion content. Report vulnerabilities privately; see SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options:
        - Source checkout
        - Standard container / Compose
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps, expected behavior and actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: OS, client/model, HTTP status/error code and relevant redacted server logs. No credentials or request bodies.
